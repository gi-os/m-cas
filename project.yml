name: MCas
options:
  bundleIdPrefix: com.gios
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
targets:
  MCas:
    type: application
    platform: iOS
    sources:
      - path: MCas
      - path: Shared
    dependencies:
      - target: MCasWidgets
    info:
      path: MCas/Info.plist
      properties:
        CFBundleDisplayName: m-cas
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: m-cas records the room around you onto your tape.
        NSLocationWhenInUseUsageDescription: m-cas names each clip after where you recorded it, like "Trastevere, Rome".
        UIBackgroundModes: [audio]
        UIAppFonts: [Silkscreen-Regular.ttf, Silkscreen-Bold.ttf]
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.gios.mcas
            CFBundleURLSchemes: [mcas]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gios.mcas
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) MCAS_APP"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  MCasWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: MCasWidgets
      - path: Shared
      - path: MCas/Resources/Silkscreen-Regular.ttf
      - path: MCas/Resources/Silkscreen-Bold.ttf
    info:
      path: MCasWidgets/Info.plist
      properties:
        CFBundleDisplayName: m-cas
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: [Silkscreen-Regular.ttf, Silkscreen-Bold.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gios.mcas.widgets
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  MCasTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MCasTests
    dependencies:
      - target: MCas
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gios.mcas.tests
  MCasUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MCasUITests
    dependencies:
      - target: MCas
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gios.mcas.uitests
        TEST_TARGET_NAME: MCas
schemes:
  MCasScreenshots:
    build:
      targets:
        MCas: all
        MCasUITests: [test]
    test:
      targets:
        - MCasUITests
  MCas:
    build:
      targets:
        MCas: all
        MCasTests: [test]
    test:
      targets:
        - MCasTests
